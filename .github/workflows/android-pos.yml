name: Compilar app Android (Marín POS)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-pos/**'
      - '.github/workflows/android-pos.yml'
  push:
    branches: [main]
    paths:
      - 'android-pos/**'
      - '.github/workflows/android-pos.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android-pos
        run: gradle --no-daemon assembleRelease
      - name: Guardar APK
        run: |
          mkdir -p descargas
          cp android-pos/app/build/outputs/apk/release/app-release.apk descargas/pos-marin376.apk
          # Versión publicada: la app la lee al abrirse para ofrecer la actualización (Actualizador.java).
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android-pos/app/build.gradle)
          NAME=$(grep -oP "versionName\s+'\K[^']+" android-pos/app/build.gradle)
          printf '{"versionCode":%s,"versionName":"%s","apk":"pos-marin376.apk"}\n' "$CODE" "$NAME" > descargas/pos-version.json
          cat descargas/pos-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: pos-marin376
          path: descargas/pos-marin376.apk
      - name: Publicar APK en la página (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add descargas/pos-marin376.apk descargas/pos-version.json
          if git diff --cached --quiet; then echo "APK sin cambios"; else
            git commit -m "APK Marín POS (compilado automáticamente)"
            git pull --rebase origin main
            git push
          fi
