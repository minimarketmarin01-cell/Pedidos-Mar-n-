name: Compilar app Android (Precios)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-precios/**'
      - '.github/workflows/android-precios.yml'
  push:
    branches: [main]
    paths:
      - 'android-precios/**'
      - '.github/workflows/android-precios.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probar códigos de barras (pyzbar lee lo que se manda a la impresora)
        run: |
          sudo apt-get install -y libzbar0 >/dev/null
          pip install pyzbar pillow >/dev/null
          cd android-precios/pruebas
          mkdir -p cls
          javac -encoding UTF-8 -d cls ../app/src/main/java/cl/marin376/precios/{Barras,Code128,Raster}.java PruebaBarras.java
          java -cp cls PruebaBarras
          python3 decodificar.py out
      - name: Probar calculadora (misma lógica que la de la web)
        run: android-precios/pruebas/comparar_calculadora.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android-precios
        run: gradle --no-daemon assembleRelease
      - name: Guardar APK
        run: |
          mkdir -p descargas
          cp android-precios/app/build/outputs/apk/release/app-release.apk descargas/precios-marin376.apk
          # Versión publicada: la app la lee al abrirse para ofrecer la actualización (Actualizador.java).
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android-precios/app/build.gradle)
          NAME=$(grep -oP "versionName\s+'\K[^']+" android-precios/app/build.gradle)
          printf '{"versionCode":%s,"versionName":"%s","apk":"precios-marin376.apk"}\n' "$CODE" "$NAME" > descargas/precios-version.json
          cat descargas/precios-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: precios-marin376
          path: descargas/precios-marin376.apk
      - name: Publicar APK en la página (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add descargas/precios-marin376.apk descargas/precios-version.json
          if git diff --cached --quiet; then echo "APK sin cambios"; else
            git commit -m "APK Precios Marín (compilado automáticamente)"
            git pull --rebase origin main
            git push
          fi
