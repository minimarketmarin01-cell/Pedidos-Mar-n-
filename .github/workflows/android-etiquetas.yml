name: Compilar app Android (Etiquetas)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-etiquetas/**'
      - '.github/workflows/android-etiquetas.yml'
  push:
    branches: [main]
    paths:
      - 'android-etiquetas/**'
      - '.github/workflows/android-etiquetas.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android-etiquetas
        run: gradle --no-daemon assembleRelease
      - name: Guardar APK
        run: |
          mkdir -p descargas
          cp android-etiquetas/app/build/outputs/apk/release/app-release.apk descargas/etiquetas-marin376.apk
      - uses: actions/upload-artifact@v4
        with:
          name: etiquetas-marin376
          path: descargas/etiquetas-marin376.apk
      - name: Publicar APK en la página (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add descargas/etiquetas-marin376.apk
          if git diff --cached --quiet; then echo "APK sin cambios"; else
            git commit -m "APK Etiquetas Marín 376 (compilado automáticamente)"
            git push
          fi
